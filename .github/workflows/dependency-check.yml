name: OWASP full dependency audit

on:
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-dependency-check
  cancel-in-progress: false

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    # Cold NVD initialization can be large; keep it independent of pull requests.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Calculate dependency-check cache key
        id: dependency-check-cache
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore dependency-check database
        id: dependency-check-database
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-dependency-check-v12-validated-${{ steps.dependency-check-cache.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-v12-validated-
      - name: Audit dependencies (CVSS 7+ fails)
        id: dependency-audit
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress -Dsecurity -DdataDirectory="$HOME/.cache/dependency-check" dependency-check:check
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check
          path: target/dependency-check-report.*
          if-no-files-found: warn
      - name: Save dependency-check database
        if: steps.dependency-audit.outcome == 'success' && steps.dependency-check-database.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-dependency-check-v12-validated-${{ steps.dependency-check-cache.outputs.week }}
      - name: Enforce dependency audit result
        if: steps.dependency-audit.outcome != 'success'
        run: exit 1
