services:
  juego:
    build:
      context: .
    stdin_open: true
    tty: true

  gui:
    build:
      context: .
      dockerfile: Dockerfile.gui
    ports:
      - "127.0.0.1:${TECLA_GUI_PORT:-6080}:6080"
    shm_size: "256mb"
    init: true
    restart: "no"

  javadoc:
    image: maven:3.9.11-eclipse-temurin-21-alpine
    working_dir: /workspace
    command: mvn -B -ntp javadoc:javadoc
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2

volumes:
  maven-cache:
