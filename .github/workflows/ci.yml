name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate Docker Compose and GUI entrypoint syntax
        run: |
          docker compose config --quiet
          sh -n docker/gui-entrypoint.sh
          TECLA_GUI_ENABLE_DEBUG=true docker compose config --quiet

      - name: Compile, test, analyze, package and generate Javadoc
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Show coverage summary
        if: always()
        run: |
          if [[ -f target/site/jacoco/jacoco.csv ]]; then
            awk -F, 'NR > 1 { missed += $8; covered += $9 }
              END { total=missed+covered; if (total) printf "Line coverage: %.2f%% (%d/%d)\n", 100*covered/total, covered, total }' \
              target/site/jacoco/jacoco.csv
          fi

      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: executable-jar
          path: target/the-legend-of-tecla.jar
          if-no-files-found: error

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom
          path: target/bom.json
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error

      - name: Upload Javadoc
        uses: actions/upload-artifact@v7
        with:
          name: javadoc
          path: target/reports/apidocs/
          if-no-files-found: error

      - name: Upload GUI smoke captures
        uses: actions/upload-artifact@v7
        with:
          name: gui-smoke-captures
          path: target/gui-smoke/*.png
          if-no-files-found: ignore

  dependency-audit:
    runs-on: ubuntu-latest
    # The first NVD synchronization currently contains more than 370k records.
    # Maven caching makes later audits fast, but the cold run needs more room.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Calculate dependency-check cache key
        id: dependency-check-cache
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore dependency-check database
        id: dependency-check-database
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-dependency-check-v12-${{ steps.dependency-check-cache.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-v12-
      - name: Audit dependencies (CVSS 7+ fails)
        id: dependency-audit
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress -Dsecurity -DdataDirectory="$HOME/.cache/dependency-check" dependency-check:check
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check
          path: target/dependency-check-report.*
          if-no-files-found: warn
      - name: Save dependency-check database
        if: always() && steps.dependency-check-database.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-dependency-check-v12-${{ steps.dependency-check-cache.outputs.week }}
      - name: Enforce dependency audit result
        if: steps.dependency-audit.outcome != 'success'
        run: exit 1

  gui-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build GUI container
        run: docker compose build gui

      - name: Start GUI without remote debugger
        run: docker compose up -d gui

      - name: Assert noVNC readiness and JDWP disabled by default
        run: |
          python3 - <<'PY'
          import socket
          import time
          import urllib.request

          url = "http://127.0.0.1:6080/vnc.html"
          deadline = time.monotonic() + 180
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      if response.status == 200:
                          break
              except (OSError, TimeoutError):
                  time.sleep(2)
          else:
              raise AssertionError("noVNC did not become ready within 180 seconds")

          try:
              with socket.create_connection(("127.0.0.1", 5005), timeout=3) as client:
                  client.settimeout(3)
                  client.sendall(b"JDWP-Handshake")
                  if client.recv(14) == b"JDWP-Handshake":
                      raise AssertionError("JDWP unexpectedly enabled by default")
          except (ConnectionError, TimeoutError, OSError):
              pass
          print("GUI responds; JDWP is disabled by default")
          PY

      - name: Restart GUI with explicit opt-in debugger
        run: TECLA_GUI_ENABLE_DEBUG=true docker compose up -d --force-recreate gui

      - name: Assert JDWP handshake when explicitly enabled
        run: |
          python3 - <<'PY'
          import socket
          import time

          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 5005), timeout=3) as client:
                      client.settimeout(3)
                      client.sendall(b"JDWP-Handshake")
                      if client.recv(14) == b"JDWP-Handshake":
                          print("JDWP handshake completed with opt-in enabled")
                          break
              except (ConnectionError, TimeoutError, OSError):
                  time.sleep(2)
          else:
              raise AssertionError("JDWP opt-in was not reachable")
          PY

      - name: Collect logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=150 gui

      - name: Stop GUI container
        if: always()
        run: docker compose down --remove-orphans
